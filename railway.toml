[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "complianceguard-api"

[services.variables]
PORT = "8000"
ENVIRONMENT = "production"
RUN_MIGRATIONS_ON_STARTUP = "true"
# The startCommand runs a single uvicorn worker; declare it so the scale-out
# guard can verify rate-limit correctness (undeclared WORKERS refuses to start
# in production).
WORKERS = "1"
