# ISO 27001:2013 Annex A control definitions.
# 47 representative controls across all 14 domains.
# risk_level: low | medium | high

controls:
  # ── A.5 Information Security Policies ────────────────────────────────────
  - id: A.5.1.1
    title: Policies for Information Security
    description: A set of policies for information security shall be defined, approved by management, published and communicated to employees and relevant external parties.
    category: A.5
    control_objective: Provide management direction and support for information security.
    implementation_guidance: Define an information security policy document approved at board level and communicated to all staff. Review annually or after significant changes.
    risk_level: high
    evidence_types: [security_policies, policy_document]

  - id: A.5.1.2
    title: Review of Policies for Information Security
    description: The policies for information security shall be reviewed at planned intervals or if significant changes occur.
    category: A.5
    control_objective: Ensure policies remain suitable, adequate and effective.
    implementation_guidance: Schedule annual policy reviews. Document review outcomes and any changes approved by management.
    risk_level: medium
    evidence_types: [security_policies, policy_document]

  # ── A.6 Organisation of Information Security ─────────────────────────────
  - id: A.6.1.1
    title: Information Security Roles and Responsibilities
    description: All information security responsibilities shall be defined and allocated.
    category: A.6
    control_objective: Establish a management framework to initiate and control information security implementation.
    implementation_guidance: Define RACI matrix for information security roles. Assign an Information Security Officer.
    risk_level: high
    evidence_types: [security_policies, user_provisioning]

  - id: A.6.1.2
    title: Segregation of Duties
    description: Conflicting duties and areas of responsibility shall be segregated to reduce opportunities for unauthorised or unintentional modification or misuse of assets.
    category: A.6
    control_objective: Reduce risk of fraud, error, and bypass of security controls.
    implementation_guidance: Identify conflicting roles and enforce separation via access controls and workflow approvals.
    risk_level: high
    evidence_types: [security_policies, user_provisioning]

  - id: A.6.2.1
    title: Mobile Device Policy
    description: A policy and supporting security measures shall be adopted to manage the risks introduced by using mobile devices.
    category: A.6
    control_objective: Ensure the security of information accessed, processed or stored on mobile devices.
    implementation_guidance: Implement MDM solution, enforce encryption, remote wipe, and screen lock on all mobile devices.
    risk_level: medium
    evidence_types: [security_policies, user_provisioning]

  # ── A.7 Human Resource Security ──────────────────────────────────────────
  - id: A.7.1.1
    title: Screening
    description: Background verification checks on all candidates for employment shall be carried out in accordance with relevant laws, regulations and ethics.
    category: A.7
    control_objective: Ensure employees and contractors are suitable and understand their responsibilities.
    implementation_guidance: Conduct background checks before employment. Document checks performed and results.
    risk_level: medium
    evidence_types: [security_policies, policy_document]

  - id: A.7.2.2
    title: Information Security Awareness, Education and Training
    description: All employees and contractors shall receive appropriate awareness education and training and regular updates in organisational policies and procedures.
    category: A.7
    control_objective: Ensure users are aware of information security threats and their responsibilities.
    implementation_guidance: Deliver annual security awareness training. Track completion rates and test knowledge.
    risk_level: high
    evidence_types: [training_records, security_policies]

  - id: A.7.3.1
    title: Termination or Change of Employment Responsibilities
    description: Information security responsibilities and duties that remain valid after termination or change of employment shall be defined, communicated to the employee or contractor and enforced.
    category: A.7
    control_objective: Protect assets upon termination or change of employment.
    implementation_guidance: Revoke all access within 24 hours of termination. Conduct offboarding checklist.
    risk_level: high
    evidence_types: [user_provisioning, security_policies]

  # ── A.8 Asset Management ─────────────────────────────────────────────────
  - id: A.8.1.1
    title: Inventory of Assets
    description: Assets associated with information and information processing facilities shall be identified and an inventory of these assets shall be drawn up and maintained.
    category: A.8
    control_objective: Identify organisational assets and define appropriate protection responsibilities.
    implementation_guidance: Maintain a CMDB with all hardware, software, data, and cloud assets. Review quarterly.
    risk_level: medium
    evidence_types: [system_configs, policy_document]

  - id: A.8.1.3
    title: Acceptable Use of Assets
    description: Rules for the acceptable use of information and of assets associated with information and information processing facilities shall be identified, documented and implemented.
    category: A.8
    control_objective: Ensure information and assets are appropriately protected.
    implementation_guidance: Publish an acceptable use policy. Include in onboarding and require annual sign-off.
    risk_level: medium
    evidence_types: [system_configs, policy_document]

  - id: A.8.2.1
    title: Classification of Information
    description: Information shall be classified in terms of legal requirements, value, criticality and sensitivity to unauthorised disclosure or modification.
    category: A.8
    control_objective: Ensure information receives appropriate levels of protection.
    implementation_guidance: Define classification tiers (Public, Internal, Confidential, Restricted). Label all data assets.
    risk_level: high
    evidence_types: [system_configs, policy_document]

  - id: A.8.3.1
    title: Management of Removable Media
    description: Procedures shall be implemented for the management of removable media in accordance with the classification scheme.
    category: A.8
    control_objective: Prevent unauthorised disclosure, modification, removal, or destruction of information on removable media.
    implementation_guidance: Disable USB ports by default. Allow exceptions only via approved process with encryption required.
    risk_level: medium
    evidence_types: [system_configs, policy_document]

  # ── A.9 Access Control ────────────────────────────────────────────────────
  - id: A.9.1.1
    title: Access Control Policy
    description: An access control policy shall be established, documented and reviewed based on business and information security requirements.
    category: A.9
    control_objective: Limit access to information and information processing facilities.
    implementation_guidance: Document role-based access control policy. Review at least annually and after organisational changes.
    risk_level: high
    related_controls: [A.9.1.2, A.9.2.1]
    evidence_types: [user_provisioning, policy_document]

  - id: A.9.2.1
    title: User Registration and De-registration
    description: A formal user registration and de-registration process shall be implemented to enable assignment of access rights.
    category: A.9
    control_objective: Ensure authorised user access and prevent unauthorised access.
    implementation_guidance: Implement formal joiner/leaver/mover process. Automate provisioning and deprovisioning where possible.
    risk_level: high
    evidence_types: [user_provisioning, system_configs]

  - id: A.9.2.3
    title: Management of Privileged Access Rights
    description: The allocation and use of privileged access rights shall be restricted and controlled.
    category: A.9
    control_objective: Prevent unauthorised access to critical systems.
    implementation_guidance: Implement PAM solution. Require MFA for all privileged accounts. Review quarterly.
    risk_level: high
    evidence_types: [user_provisioning, system_configs]

  - id: A.9.3.1
    title: Use of Secret Authentication Information
    description: Users shall be required to follow the organisation's practices in the use of secret authentication information.
    category: A.9
    control_objective: Prevent unauthorised access to systems and services.
    implementation_guidance: Enforce strong password policy (12+ chars, complexity, no reuse). Deploy password manager.
    risk_level: high
    evidence_types: [user_provisioning, security_policies]

  - id: A.9.4.1
    title: Information Access Restriction
    description: Access to information and application system functions shall be restricted in accordance with the access control policy.
    category: A.9
    control_objective: Prevent unauthorised access to systems and applications.
    implementation_guidance: Implement least-privilege access. Review access rights quarterly.
    risk_level: high
    evidence_types: [system_configs, user_provisioning]

  - id: A.9.4.4
    title: Use of Privileged Utility Programs
    description: The use of utility programs that might be capable of overriding system and application controls shall be restricted and tightly controlled.
    category: A.9
    control_objective: Prevent circumvention of system controls.
    implementation_guidance: Inventory all privileged utilities. Restrict access to authorised personnel only with logging.
    risk_level: medium
    evidence_types: [system_configs, user_provisioning]

  # ── A.10 Cryptography ────────────────────────────────────────────────────
  - id: A.10.1.1
    title: Policy on the Use of Cryptographic Controls
    description: A policy on the use of cryptographic controls for protection of information shall be developed and implemented.
    category: A.10
    control_objective: Ensure proper and effective use of cryptography to protect confidentiality, authenticity, and integrity.
    implementation_guidance: Document approved cryptographic algorithms (AES-256, RSA-2048+, TLS 1.2+). Prohibit weak ciphers.
    risk_level: high
    evidence_types: [encryption_policies, system_configs]

  - id: A.10.1.2
    title: Key Management
    description: A policy on the use, protection and lifetime of cryptographic keys shall be developed and implemented through their whole lifecycle.
    category: A.10
    control_objective: Ensure proper management of cryptographic keys.
    implementation_guidance: Use a KMS for key storage. Enforce key rotation schedules. Document key custodians.
    risk_level: high
    evidence_types: [encryption_policies, system_configs]

  # ── A.11 Physical and Environmental Security ──────────────────────────────
  - id: A.11.1.1
    title: Physical Security Perimeter
    description: Security perimeters shall be defined and used to protect areas that contain either sensitive or critical information and information processing facilities.
    category: A.11
    control_objective: Prevent unauthorised physical access, damage, and interference.
    implementation_guidance: Define and document physical security zones. Implement badge access, CCTV, and visitor logs.
    risk_level: high
    evidence_types: [policy_document, audit_reports]

  - id: A.11.1.2
    title: Physical Entry Controls
    description: Secure areas shall be protected by appropriate entry controls to ensure that only authorised personnel are allowed access.
    category: A.11
    control_objective: Ensure only authorised personnel access secure areas.
    implementation_guidance: Deploy card/biometric access on all secure areas. Review access logs monthly.
    risk_level: high
    evidence_types: [policy_document, audit_reports]

  - id: A.11.2.4
    title: Equipment Maintenance
    description: Equipment shall be correctly maintained to ensure its continued availability and integrity.
    category: A.11
    control_objective: Prevent loss, damage, theft or compromise of assets.
    implementation_guidance: Follow manufacturer maintenance schedules. Document all maintenance activities.
    risk_level: low
    evidence_types: [policy_document, audit_reports]

  - id: A.11.2.7
    title: Secure Disposal or Reuse of Equipment
    description: All items of equipment containing storage media shall be verified to ensure that any sensitive data and licensed software has been removed or securely overwritten prior to disposal or re-use.
    category: A.11
    control_objective: Prevent leakage of information from equipment to be disposed or reused.
    implementation_guidance: Use NIST 800-88 compliant data destruction. Certificate of destruction required for all disposals.
    risk_level: high
    evidence_types: [policy_document, audit_reports]

  # ── A.12 Operations Security ──────────────────────────────────────────────
  - id: A.12.1.1
    title: Documented Operating Procedures
    description: Operating procedures shall be documented and made available to all users who need them.
    category: A.12
    control_objective: Ensure correct and secure operations of information processing facilities.
    implementation_guidance: Document all standard operating procedures in a versioned knowledge base. Review annually.
    risk_level: medium
    evidence_types: [system_configs, audit_reports]

  - id: A.12.2.1
    title: Controls Against Malware
    description: Detection, prevention and recovery controls to protect against malware shall be implemented, combined with appropriate user awareness.
    category: A.12
    control_objective: Protect integrity of software and information against malware threats.
    implementation_guidance: Deploy EDR on all endpoints. Enable automatic updates. Block execution of unapproved software.
    risk_level: high
    evidence_types: [system_configs, audit_reports]

  - id: A.12.3.1
    title: Information Backup
    description: Backup copies of information, software and system images shall be taken and tested regularly in accordance with an agreed backup policy.
    category: A.12
    control_objective: Protect against loss of data.
    implementation_guidance: Implement 3-2-1 backup strategy. Test restores quarterly. Encrypt all backup media.
    risk_level: high
    evidence_types: [backup_logs, policy_document]

  - id: A.12.4.1
    title: Event Logging
    description: Event logs recording user activities, exceptions, faults and information security events shall be produced, kept and regularly reviewed.
    category: A.12
    control_objective: Record events and generate evidence to support investigation of information security incidents.
    implementation_guidance: Centralise logs to SIEM. Retain for minimum 12 months. Alert on critical events.
    risk_level: high
    evidence_types: [event_logs, system_configs, audit_reports]

  - id: A.12.6.1
    title: Management of Technical Vulnerabilities
    description: Information about technical vulnerabilities of information systems being used shall be obtained in a timely fashion, the organisation's exposure to such vulnerabilities evaluated, and appropriate measures taken.
    category: A.12
    control_objective: Prevent exploitation of technical vulnerabilities.
    implementation_guidance: Run authenticated vulnerability scans monthly. Patch critical CVEs within 30 days.
    risk_level: high
    evidence_types: [system_configs, audit_reports]

  - id: A.12.7.1
    title: Information Systems Audit Controls
    description: Audit requirements and activities involving verification of operational systems shall be carefully planned and agreed to minimise disruptions to business processes.
    category: A.12
    control_objective: Minimise impact of audit activities on operational systems.
    implementation_guidance: Schedule audit activities outside peak hours. Use read-only audit accounts.
    risk_level: low
    evidence_types: [system_configs, audit_reports]

  # ── A.13 Communications Security ─────────────────────────────────────────
  - id: A.13.1.1
    title: Network Controls
    description: Networks shall be managed and controlled to protect information in systems and applications.
    category: A.13
    control_objective: Ensure protection of information in networks and supporting information processing facilities.
    implementation_guidance: Segment networks by sensitivity. Implement IDS/IPS. Review firewall rules quarterly.
    risk_level: high
    evidence_types: [network_configs, firewall_configs]

  - id: A.13.2.1
    title: Information Transfer Policies and Procedures
    description: Formal transfer policies, procedures and controls shall be in place to protect the transfer of information through the use of all types of communication facilities.
    category: A.13
    control_objective: Maintain security of information transferred within an organisation and with external entities.
    implementation_guidance: Enforce TLS for all data in transit. Prohibit transfer of sensitive data via unencrypted channels.
    risk_level: high
    evidence_types: [network_configs, firewall_configs]

  - id: A.13.2.3
    title: Electronic Messaging
    description: Information involved in electronic messaging shall be appropriately protected.
    category: A.13
    control_objective: Ensure appropriate protection of information in electronic messaging.
    implementation_guidance: Enable email encryption for sensitive communications. Deploy DLP to prevent data leakage.
    risk_level: medium
    evidence_types: [network_configs, firewall_configs]

  # ── A.14 System Acquisition, Development and Maintenance ──────────────────
  - id: A.14.1.1
    title: Information Security Requirements Analysis
    description: The information security related requirements shall be included in the requirements for new information systems or enhancements to existing information systems.
    category: A.14
    control_objective: Ensure information security is an integral part of information systems.
    implementation_guidance: Include security requirements in project intake process. Conduct threat modelling for new systems.
    risk_level: high
    evidence_types: [policy_document, audit_reports]

  - id: A.14.2.1
    title: Secure Development Policy
    description: Rules for the development of software and systems shall be established and applied to developments within the organisation.
    category: A.14
    control_objective: Ensure information security is designed and implemented within the development lifecycle.
    implementation_guidance: Enforce OWASP Top 10 controls. Mandate code review. Run SAST/DAST in CI pipeline.
    risk_level: high
    evidence_types: [policy_document, audit_reports]

  - id: A.14.2.8
    title: System Security Testing
    description: Testing of security functionality shall be carried out during development.
    category: A.14
    control_objective: Validate security controls operate as intended.
    implementation_guidance: Require security test cases in test plans. Conduct penetration testing annually.
    risk_level: high
    evidence_types: [policy_document, audit_reports]

  - id: A.14.3.1
    title: Protection of Test Data
    description: Test data shall be selected carefully, protected and controlled.
    category: A.14
    control_objective: Ensure protection of data used for testing.
    implementation_guidance: Anonymise or synthesise all test data. Prohibit use of live production data in test environments.
    risk_level: high
    evidence_types: [policy_document, audit_reports]

  # ── A.15 Supplier Relationships ───────────────────────────────────────────
  - id: A.15.1.1
    title: Information Security Policy for Supplier Relationships
    description: Information security requirements for mitigating risks associated with supplier's access to the organisation's assets shall be agreed with the supplier and documented.
    category: A.15
    control_objective: Ensure protection of assets accessible by suppliers.
    implementation_guidance: Include security requirements in all supplier contracts. Conduct annual supplier risk assessments.
    risk_level: high
    evidence_types: [policy_document, audit_reports]

  - id: A.15.2.1
    title: Monitoring and Review of Supplier Services
    description: Organisations shall regularly monitor, review and audit supplier service delivery.
    category: A.15
    control_objective: Maintain agreed level of information security and service delivery.
    implementation_guidance: Review supplier security posture annually. Track incidents and SLA compliance.
    risk_level: medium
    evidence_types: [policy_document, audit_reports]

  # ── A.16 Information Security Incident Management ─────────────────────────
  - id: A.16.1.1
    title: Responsibilities and Procedures
    description: Management responsibilities and procedures shall be established to ensure a quick, effective and orderly response to information security incidents.
    category: A.16
    control_objective: Ensure consistent and effective approach to managing information security incidents.
    implementation_guidance: Document and test incident response plan. Define roles and escalation paths. Review annually.
    risk_level: high
    evidence_types: [incident_reports, event_logs]

  - id: A.16.1.2
    title: Reporting Information Security Events
    description: Information security events shall be reported through appropriate management channels as quickly as possible.
    category: A.16
    control_objective: Enable timely corrective action against information security events.
    implementation_guidance: Establish clear reporting channels. Train all staff to recognise and report incidents.
    risk_level: high
    evidence_types: [incident_reports, event_logs]

  - id: A.16.1.5
    title: Response to Information Security Incidents
    description: Information security incidents shall be responded to in accordance with the documented procedures.
    category: A.16
    control_objective: Ensure effective and orderly resolution of information security incidents.
    implementation_guidance: Follow documented IR runbooks. Log all response actions. Conduct post-incident review within 5 days.
    risk_level: high
    evidence_types: [incident_reports, event_logs]

  # ── A.17 Business Continuity Management ───────────────────────────────────
  - id: A.17.1.1
    title: Planning Information Security Continuity
    description: The organisation shall determine its requirements for information security and the continuity of information security management in adverse situations.
    category: A.17
    control_objective: Embed information security continuity in business continuity management.
    implementation_guidance: Include information security requirements in BCP. Define RTO/RPO for critical systems.
    risk_level: high
    evidence_types: [backup_logs, policy_document]

  - id: A.17.1.3
    title: Verify, Review and Evaluate Information Security Continuity
    description: The organisation shall verify the established and implemented information security continuity controls at regular intervals in order to ensure that they are valid and effective.
    category: A.17
    control_objective: Ensure continuity controls remain valid and effective.
    implementation_guidance: Test BCP/DR annually. Document results and remediate gaps within 90 days.
    risk_level: high
    evidence_types: [backup_logs, policy_document]

  # ── A.18 Compliance ───────────────────────────────────────────────────────
  - id: A.18.1.1
    title: Identification of Applicable Legislation and Contractual Requirements
    description: All relevant legislative statutory, regulatory, contractual requirements and the organisation's approach to meet these requirements shall be explicitly identified, documented and kept up to date.
    category: A.18
    control_objective: Avoid breaches of legal, statutory, regulatory or contractual obligations.
    implementation_guidance: Maintain a compliance register. Assign ownership to each obligation. Review quarterly.
    risk_level: high
    evidence_types: [audit_reports, policy_document]

  - id: A.18.1.3
    title: Protection of Records
    description: Records shall be protected from loss, destruction, falsification, unauthorised access and unauthorised release, in accordance with legislative, statutory, regulatory, contractual and business requirements.
    category: A.18
    control_objective: Ensure compliance with legal, statutory, regulatory and contractual requirements on records management.
    implementation_guidance: Implement record retention policy. Enforce immutable logging. Encrypt records at rest.
    risk_level: high
    evidence_types: [audit_reports, policy_document]

  - id: A.18.2.2
    title: Compliance with Security Policies and Standards
    description: Managers shall regularly review the compliance of information processing and procedures within their area of responsibility with the appropriate security policies, standards and any other security requirements.
    category: A.18
    control_objective: Ensure information security is implemented and operated in accordance with policies and standards.
    implementation_guidance: Conduct annual internal security audits. Publish compliance dashboards to management.
    risk_level: medium
    evidence_types: [audit_reports, policy_document]
