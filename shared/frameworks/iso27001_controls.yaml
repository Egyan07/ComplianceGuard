# ISO/IEC 27001:2022 — Annex A (complete)
#
# THE canonical ISO 27001 definition. Both scoring engines (backend
# canonical_evidence.py and electron/processing/canonical-engine.js), the
# desktop framework browser, and the generated frontend evidence catalog all
# read THIS file. Do not maintain a second copy.
#
# Structure (per ISO/IEC 27001:2022 Annex A — 93 controls, four themes):
#   A.5 Organizational controls (37)   A.6 People controls (8)
#   A.7 Physical controls (14)         A.8 Technological controls (34)
#
# Control titles are the official Annex A control names. One-line descriptions
# are the project's short summaries (ISO/IEC 27002:2022 provides the detailed
# guidance; ISO texts are copyrighted, so no standard text is reproduced here).
#
# ISO/IEC 27001:2013 is withdrawn (transition ended 2025-10-31). The former
# 2013 definition is preserved as shared/frameworks/iso27001_2013_archived.yaml
# for rendering historical evaluations only — it is NOT loaded by any engine.
#
# assessment_mode: automatable | hybrid | manual_upload (see soc2_controls.yaml).
#
framework:
  id: iso27001_v2022
  name: ISO/IEC 27001:2022
  version: '2022'
  taxonomy: 'ISO/IEC 27001:2022 Annex A (93 controls)'
  scope_note: >-
    Complete Annex A control set across all four themes. Endpoint collectors
    can only evidence the technological controls; organizational, people, and
    physical controls require uploaded manual evidence.
  status_vocabulary:
    - compliant
    - partial
    - non_compliant
    - not_assessed
controls:
  # ── A.5 Organizational controls (37) ──────────────────────────────────────
  - id: A.5.1
    title: Policies for information security
    description: Define, approve, publish, and review information security policies.
    category: A.5
    control_objective: Provide management direction for information security through policy.
    implementation_guidance: Maintain an approved information security policy set and review it on a defined cadence.
    risk_level: high
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.5.2
    title: Information security roles and responsibilities
    description: Define and allocate security roles and responsibilities according to organizational needs.
    category: A.5
    control_objective: Ensure accountability for information security.
    implementation_guidance: Document security responsibilities per role and communicate them.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.5.3
    title: Segregation of duties
    description: Separate conflicting duties and areas of responsibility to reduce fraud and error risk.
    category: A.5
    control_objective: Reduce risk of unauthorized or unintentional modification through duty separation.
    implementation_guidance: Document duty separation for critical functions.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.5.4
    title: Management responsibilities
    description: Require management to enforce security behavior and ensure personnel apply security per policy.
    category: A.5
    control_objective: Ensure managers understand and fulfill their security role.
    implementation_guidance: Embed security duties in management role descriptions.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.5.5
    title: Contact with authorities
    description: Establish and maintain contact with relevant authorities.
    category: A.5
    control_objective: Ensure appropriate information flow with authorities.
    implementation_guidance: Document authority contact points and escalation paths.
    risk_level: low
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.5.6
    title: Contact with special interest groups
    description: Establish and maintain contact with special interest groups and security forums.
    category: A.5
    control_objective: Stay informed of threats and best practices through peer engagement.
    implementation_guidance: Record group memberships and engagement cadence.
    risk_level: low
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.5.7
    title: Threat intelligence
    description: Collect and analyze threat intelligence relating to information security.
    category: A.5
    control_objective: Understand the threat landscape relevant to the organization.
    implementation_guidance: Document threat-intelligence sources and review process.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.5.8
    title: Information security in project management
    description: Integrate information security into project management at all stages.
    category: A.5
    control_objective: Manage security risk across projects.
    implementation_guidance: Require security gates in project methodology documentation.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.5.9
    title: Inventory of information and other associated assets
    description: Develop and maintain an inventory of information and associated assets with owners.
    category: A.5
    control_objective: Know what assets exist and who owns them.
    implementation_guidance: Maintain an asset register; endpoint software inventory supports it.
    risk_level: medium
    assessment_mode: hybrid
    required_evidence: [system_configs, audit_reports]
  - id: A.5.10
    title: Acceptable use of information and other associated assets
    description: Define, document, and implement acceptable-use rules for information and assets.
    category: A.5
    control_objective: Prevent misuse of organizational assets.
    implementation_guidance: Publish an acceptable-use policy and record acknowledgement.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.5.11
    title: Return of assets
    description: Personnel and external parties return assets on change or termination of engagement.
    category: A.5
    control_objective: Ensure assets are returned when no longer required.
    implementation_guidance: Include asset return in offboarding checklists.
    risk_level: low
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.5.12
    title: Classification of information
    description: Classify information according to confidentiality, integrity, availability, and stakeholder needs.
    category: A.5
    control_objective: Apply protection proportional to information value and sensitivity.
    implementation_guidance: Maintain a classification scheme and classify stored information.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.5.13
    title: Labelling of information
    description: Implement labelling procedures for classified information.
    category: A.5
    control_objective: Make classification visible in documents and systems.
    implementation_guidance: Document labelling conventions per classification level.
    risk_level: low
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.5.14
    title: Information transfer
    description: Establish rules and measures for transferring information inside and outside the organization.
    category: A.5
    control_objective: Protect information in transit across all transfer channels.
    implementation_guidance: Document transfer rules; endpoint network evidence supports partial assessment.
    risk_level: medium
    assessment_mode: hybrid
    required_evidence: [network_configs, policy_document]
  - id: A.5.15
    title: Access control
    description: Control physical and logical access to information and assets based on requirements.
    category: A.5
    control_objective: Limit access to authorized parties per business needs.
    implementation_guidance: Maintain access-control policy; endpoint configuration evidence supports partial assessment.
    risk_level: high
    assessment_mode: hybrid
    required_evidence: [system_configs, policy_document]
  - id: A.5.16
    title: Identity management
    description: Manage the full life cycle of identities across systems.
    category: A.5
    control_objective: Ensure identities are uniquely assigned and managed.
    implementation_guidance: Document identity lifecycle; local account evidence supports partial assessment.
    risk_level: medium
    assessment_mode: hybrid
    required_evidence: [user_provisioning, policy_document]
  - id: A.5.17
    title: Authentication information
    description: Control the allocation and management of authentication information through a defined process.
    category: A.5
    control_objective: Keep credentials and secrets protected and managed.
    implementation_guidance: Document credential-handling process; password policy evidence supports partial assessment.
    risk_level: high
    assessment_mode: hybrid
    required_evidence: [security_policies, policy_document]
  - id: A.5.18
    title: Access rights
    description: Provision, review, modify, and revoke access rights per the access-control policy.
    category: A.5
    control_objective: Keep access aligned with current authorization.
    implementation_guidance: Run access reviews; account evidence supports partial assessment.
    risk_level: high
    assessment_mode: hybrid
    required_evidence: [user_provisioning, policy_document]
  - id: A.5.19
    title: Information security in supplier relationships
    description: Define and apply processes for managing security risks in supplier relationships.
    category: A.5
    control_objective: Protect organizational data shared with suppliers.
    implementation_guidance: Maintain supplier security processes.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.5.20
    title: Addressing information security within supplier agreements
    description: Agree security requirements in supplier agreements per classification and risk.
    category: A.5
    control_objective: Make supplier security obligations contractual.
    implementation_guidance: Include security clauses in supplier contracts.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.5.21
    title: Managing information security in the ICT supply chain
    description: Define and apply processes to manage security risks in the ICT supply chain.
    category: A.5
    control_objective: Manage supply-chain security risk for ICT products and services.
    implementation_guidance: Document supply-chain security requirements and assessments.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.5.22
    title: Monitoring, review and change management of supplier services
    description: Monitor, review, and manage changes in supplier services and security.
    category: A.5
    control_objective: Keep supplier service security at the agreed level.
    implementation_guidance: Document supplier review cadence and change handling.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence: [audit_reports, policy_document]
  - id: A.5.23
    title: Information security for use of cloud services
    description: Establish and apply processes for acquiring, using, and exiting cloud services.
    category: A.5
    control_objective: Manage cloud-specific security risk through the service life cycle.
    implementation_guidance: Maintain a cloud-services policy covering acquisition and exit.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.5.24
    title: Information security incident management planning and preparation
    description: Plan and prepare for incident management by defining processes, roles, and responsibilities.
    category: A.5
    control_objective: Be ready to manage incidents in a structured way.
    implementation_guidance: Maintain an incident-management plan with defined roles.
    risk_level: high
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.5.25
    title: Assessment and decision on information security events
    description: Assess information security events and decide whether they are incidents.
    category: A.5
    control_objective: Evaluate events consistently to identify incidents.
    implementation_guidance: Document event-evaluation criteria and triage outcomes.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence: [incident_reports]
  - id: A.5.26
    title: Response to information security incidents
    description: Respond to incidents per documented procedures.
    category: A.5
    control_objective: Contain and address incidents consistently.
    implementation_guidance: Follow the incident-response procedure and record actions.
    risk_level: high
    assessment_mode: manual_upload
    required_evidence: [incident_reports]
  - id: A.5.27
    title: Learning from information security incidents
    description: Use knowledge from incidents to strengthen controls.
    category: A.5
    control_objective: Reduce likelihood or impact of future incidents.
    implementation_guidance: Record lessons learned and track resulting improvements.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence: [incident_reports]
  - id: A.5.28
    title: Collection of evidence
    description: Establish and implement procedures for the identification, collection, acquisition, and preservation of evidence.
    category: A.5
    control_objective: Ensure evidence is usable for disciplinary or legal action.
    implementation_guidance: Document evidence-handling procedures.
    risk_level: low
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.5.29
    title: Information security during disruption
    description: Plan how information security will be maintained during disruption.
    category: A.5
    control_objective: Keep protection intact during adverse conditions.
    implementation_guidance: Address security in continuity plans.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.5.30
    title: ICT readiness for business continuity
    description: Prepare ICT for business-continuity requirements.
    category: A.5
    control_objective: Ensure ICT can support continuity objectives.
    implementation_guidance: Document ICT continuity readiness and test results.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence: [backup_logs, policy_document]
  - id: A.5.31
    title: Identification of legal, statutory, regulatory and contractual requirements
    description: Identify and document legal, statutory, regulatory, and contractual security requirements.
    category: A.5
    control_objective: Know and address the external compliance obligations.
    implementation_guidance: Maintain a compliance-obligations register.
    risk_level: high
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.5.32
    title: Intellectual property rights
    description: Implement procedures to protect intellectual property rights.
    category: A.5
    control_objective: Avoid IP infringement and protect owned IP.
    implementation_guidance: Document IP-protection and licensing-compliance procedures.
    risk_level: low
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.5.33
    title: Protection of records
    description: Protect records from loss, destruction, falsification, unauthorized access, and release.
    category: A.5
    control_objective: Keep records protected and available per requirements.
    implementation_guidance: Document records-protection and retention procedures.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.5.34
    title: Privacy and protection of PII
    description: Implement policies and controls for privacy and protection of personally identifiable information.
    category: A.5
    control_objective: Meet privacy obligations for PII.
    implementation_guidance: Maintain a PII-protection policy aligned to applicable privacy law.
    risk_level: high
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.5.35
    title: Independent review of information security
    description: Review the approach to information security and its implementation independently at planned intervals.
    category: A.5
    control_objective: Verify security effectiveness through independent review.
    implementation_guidance: Schedule independent reviews and retain results.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence: [audit_reports]
  - id: A.5.36
    title: Compliance with policies and standards for information security
    description: Verify compliance with security policies and standards regularly.
    category: A.5
    control_objective: Detect and address policy non-compliance.
    implementation_guidance: Document compliance-check procedures and findings.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence: [audit_reports]
  - id: A.5.37
    title: Documented operating procedures
    description: Define, document, and make available operating procedures for information processing.
    category: A.5
    control_objective: Ensure consistent, secure operation.
    implementation_guidance: Maintain documented procedures for critical operations.
    risk_level: low
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  # ── A.6 People controls (8) ───────────────────────────────────────────────
  - id: A.6.1
    title: Screening
    description: Perform background verification checks on candidates per applicable law and ethics.
    category: A.6
    control_objective: Reduce insider risk at hiring.
    implementation_guidance: Document screening policy and retain check records.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.6.2
    title: Terms and conditions of employment
    description: Define security-relevant employment terms and communicate them.
    category: A.6
    control_objective: Make employees aware of their security obligations.
    implementation_guidance: Include security responsibilities in employment terms.
    risk_level: low
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.6.3
    title: Information security awareness, education and training
    description: Ensure personnel receive security awareness, education, and training.
    category: A.6
    control_objective: Equip personnel to fulfill their security responsibilities.
    implementation_guidance: Run a security-awareness program and retain completion records.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence: [training_records, policy_document]
  - id: A.6.4
    title: Disciplinary process
    description: Formalize and communicate a disciplinary process for security violations.
    category: A.6
    control_objective: Deter security violations.
    implementation_guidance: Document the disciplinary process.
    risk_level: low
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.6.5
    title: Responsibilities after termination or change of employment
    description: Define and enforce security responsibilities that survive termination or change.
    category: A.6
    control_objective: Keep confidentiality obligations in force after departure.
    implementation_guidance: Address post-employment duties in offboarding.
    risk_level: low
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.6.6
    title: Confidentiality or non-disclosure agreements
    description: Identify, document, and regularly review confidentiality/NDA requirements.
    category: A.6
    control_objective: Bind personnel and parties to confidentiality.
    implementation_guidance: Maintain NDAs and review them periodically.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.6.7
    title: Remote working
    description: Implement security measures for remote working per policy.
    category: A.6
    control_objective: Protect information accessed outside the office.
    implementation_guidance: Maintain a remote-working policy; endpoint posture supports partial assessment.
    risk_level: medium
    assessment_mode: hybrid
    required_evidence: [security_policies, policy_document]
  - id: A.6.8
    title: Information security event reporting
    description: Provide a mechanism for personnel to report observed or suspected security events.
    category: A.6
    control_objective: Enable timely reporting of security events.
    implementation_guidance: Document reporting channels and response expectations.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  # ── A.7 Physical controls (14) ────────────────────────────────────────────
  - id: A.7.1
    title: Physical security perimeter
    description: Define and use security perimeters to protect facilities and information.
    category: A.7
    control_objective: Physically separate and protect processing areas.
    implementation_guidance: Document perimeter controls for facilities.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.7.2
    title: Physical entry controls
    description: Protect secure areas with appropriate entry controls.
    category: A.7
    control_objective: Restrict and log physical entry.
    implementation_guidance: Document badge/entry controls and visitor handling.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.7.3
    title: Securing offices, rooms and facilities
    description: Design and implement physical security for offices, rooms, and facilities.
    category: A.7
    control_objective: Protect facilities against physical threats.
    implementation_guidance: Document office/room security measures.
    risk_level: low
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.7.4
    title: Physical security monitoring
    description: Continuously monitor premises for unauthorized physical access or damage.
    category: A.7
    control_objective: Detect physical intrusion or damage.
    implementation_guidance: Document monitoring measures (e.g., alarms, CCTV).
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.7.5
    title: Protecting against physical and environmental threats
    description: Protect infrastructure against physical and environmental threats.
    category: A.7
    control_objective: Reduce physical/environmental risk to facilities.
    implementation_guidance: Document threat protection measures for facilities.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.7.6
    title: Working in secure areas
    description: Design and apply security measures for working in secure areas.
    category: A.7
    control_objective: Protect information in sensitive physical work areas.
    implementation_guidance: Document secure-area working rules.
    risk_level: low
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.7.7
    title: Clear desk and clear screen
    description: Define and enforce clear-desk and clear-screen rules.
    category: A.7
    control_objective: Reduce exposure of information on desks and screens.
    implementation_guidance: Maintain a clear-desk/clear-screen policy; screen-lock config supports partial assessment.
    risk_level: low
    assessment_mode: hybrid
    required_evidence: [security_policies, policy_document]
  - id: A.7.8
    title: Equipment siting and protection
    description: Site and protect equipment safely and securely.
    category: A.7
    control_objective: Reduce physical risk to equipment.
    implementation_guidance: Document equipment siting rules.
    risk_level: low
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.7.9
    title: Security of assets off-premises
    description: Protect assets used outside the premises.
    category: A.7
    control_objective: Extend protection beyond physical facilities.
    implementation_guidance: Document off-premises asset rules; endpoint posture supports partial assessment.
    risk_level: medium
    assessment_mode: hybrid
    required_evidence: [system_configs, policy_document]
  - id: A.7.10
    title: Storage media
    description: Manage the life cycle of storage media through acquisition, use, and disposal.
    category: A.7
    control_objective: Prevent leakage from removable and stored media.
    implementation_guidance: Document media-handling and disposal procedures.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.7.11
    title: Supporting utilities
    description: Protect against failures of supporting utilities (power, telecom, water, HVAC).
    category: A.7
    control_objective: Maintain operation despite utility failure.
    implementation_guidance: Document utility protection measures.
    risk_level: low
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.7.12
    title: Cabling security
    description: Protect power and telecommunications cabling from interception or damage.
    category: A.7
    control_objective: Prevent cable-based compromise.
    implementation_guidance: Document cabling-protection measures.
    risk_level: low
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.7.13
    title: Equipment maintenance
    description: Maintain equipment to ensure availability and integrity.
    category: A.7
    control_objective: Keep equipment serviceable and secure.
    implementation_guidance: Document maintenance schedules and records.
    risk_level: low
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.7.14
    title: Secure disposal or re-use of equipment
    description: Verify equipment containing storage media is securely disposed of or re-used.
    category: A.7
    control_objective: Prevent data recovery from disposed equipment.
    implementation_guidance: Document sanitization and disposal verification.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  # ── A.8 Technological controls (34) ───────────────────────────────────────
  - id: A.8.1
    title: User endpoint devices
    description: Protect information stored on, processed by, or accessible via user endpoint devices.
    category: A.8
    control_objective: Secure laptops, desktops, and mobile devices against endpoint threats.
    implementation_guidance: Enforce endpoint protection and configuration baselines; collect endpoint evidence.
    risk_level: high
    assessment_mode: hybrid
    required_evidence: [system_configs, security_policies, policy_document]
  - id: A.8.2
    title: Privileged access rights
    description: Restrict and manage the allocation and use of privileged access rights.
    category: A.8
    control_objective: Limit and monitor administrative access.
    implementation_guidance: Review admin-group membership; local account evidence supports partial assessment.
    risk_level: high
    assessment_mode: hybrid
    required_evidence: [user_provisioning, policy_document]
  - id: A.8.3
    title: Information access restriction
    description: Restrict access to information and associated assets per the access-control policy.
    category: A.8
    control_objective: Enforce authorized access to information.
    implementation_guidance: Maintain access-restriction procedures.
    risk_level: high
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.8.4
    title: Access to source code
    description: Manage read and write access to source code, development tools, and libraries.
    category: A.8
    control_objective: Protect source code integrity and confidentiality.
    implementation_guidance: Document source-code access management.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence: [policy_document]
  - id: A.8.5
    title: Secure authentication
    description: Implement secure authentication technologies and procedures per the access-control policy.
    category: A.8
    control_objective: Confirm user identity reliably before granting access.
    implementation_guidance: Enforce password policy and authentication configuration; collect endpoint evidence.
    risk_level: high
    assessment_mode: hybrid
    required_evidence: [security_policies, system_configs, policy_document]
  - id: A.8.6
    title: Capacity management
    description: Monitor and adjust resource use per capacity requirements.
    category: A.8
    control_objective: Ensure systems meet performance needs.
    implementation_guidance: Monitor capacity; endpoint configuration evidence supports partial assessment.
    risk_level: low
    assessment_mode: hybrid
    required_evidence: [system_configs, audit_reports]
  - id: A.8.7
    title: Protection against malware
    description: Implement malware protection supported by user awareness.
    category: A.8
    control_objective: Prevent, detect, and recover from malware.
    implementation_guidance: Enable real-time anti-malware protection and definition updates; collect endpoint evidence.
    risk_level: high
    assessment_mode: automatable
    required_evidence: [system_configs, event_logs]
  - id: A.8.8
    title: Management of technical vulnerabilities
    description: Obtain, assess, and address technical vulnerabilities.
    category: A.8
    control_objective: Keep systems patched against known vulnerabilities.
    implementation_guidance: Enable update services and monitor patch state; collect endpoint evidence.
    risk_level: high
    assessment_mode: hybrid
    required_evidence: [system_configs, audit_reports]
  - id: A.8.9
    title: Configuration management
    description: Establish, document, implement, monitor, and review configurations of hardware, software, and services.
    category: A.8
    control_objective: Keep configurations intentional and hardened.
    implementation_guidance: Define configuration baselines; collect endpoint configuration evidence.
    risk_level: high
