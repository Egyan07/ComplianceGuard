# NIST Cybersecurity Framework (CSF) 2.0
#
# Canonical NIST CSF 2.0 definition. Intended as the single source for the
# scoring engines (backend canonical_evidence.py and
# electron/processing/canonical-engine.js), the desktop framework browser, and
# the generated frontend evidence catalog. Both scoring engines read it under
# the `nist` framework key (backend/app/core/canonical_evidence.py and
# electron/processing/canonical-engine.js), the desktop framework browser reads
# it under browser id 5, and the generated frontend evidence catalog emits it
# as NIST_CONTROLS. # Do not maintain a second copy.
#
# Scope (batches so far):
#   - Govern:   GV.OC (5), GV.RM (7), GV.RR (4), GV.PO (2), GV.OV (3),
#               GV.SC (10) = 31 subcategories.
#   - Identify: ID.AM (7), ID.RA (10), ID.IM (4) = 21 subcategories.
#   - Protect:  PR.AA (6), PR.AT (2), PR.DS (4), PR.PS (6), PR.IR (4) = 22.
#   Total: 74 subcategories. Detect, Respond, and Recover are not yet
#   included.
#
# Subcategory IDs follow the official CSF 2.0 Core and are intentionally
# non-contiguous (e.g., ID.AM skips 06; PR.DS jumps 02 -> 10). Descriptions
# are the verbatim CSF 2.0 subcategory statements. Titles are short labels.
# `category` is the CSF category code (ID.AM, ID.RA, ...), the level at which
# a subcategory lives; the function (GV, ID, PR) is the first token of that code.
#
# assessment_mode (product classification, not part of the CSF Core):
#   automatable   - every required evidence type is produced by the endpoint
#                   collectors; the coverage engine may fully score it.
#   hybrid        - at least one required type is collector-produced and at
#                   least one is manual; endpoint evidence gives partial
#                   coverage, full coverage needs uploaded manual evidence.
#   manual_upload - no required type is collector-produced; only uploaded
#                   manual evidence can satisfy it.
#
# risk_level (house judgment; CSF assigns none):
#   high   - a failure directly enables unauthorized access or data exposure
#            (the PR.AA and PR.DS categories).
#   medium - everywhere else, including all of Govern.
#   (no `low` is used so far.)
#
framework:
  id: nist_csf_2_0
  name: NIST Cybersecurity Framework 2.0
  version: '2.0'
  taxonomy: 'Cybersecurity Framework (CSF) 2.0 Core — Functions, Categories, Subcategories'
  scope_note: >-
    Batches so far: the Govern (GV.OC, GV.RM, GV.RR, GV.PO, GV.OV, GV.SC),
    Identify (ID.AM, ID.RA, ID.IM), and Protect (PR.AA, PR.AT, PR.DS, PR.PS,
    PR.IR) functions — 74 subcategories. The Detect, Respond, and Recover
    functions are not yet included.
  status_vocabulary:
    - compliant
    - partial
    - non_compliant
    - not_assessed
controls:
  # Govern is organizational by nature: no endpoint collector can show a mission,
  # a policy, or a supplier decision, so every GV row is manual_upload and nothing
  # here is marked automatable or hybrid.
  # ── GV.OC  Organizational Context ───────────────────────────────────────────
  - id: GV.OC-01
    title: Mission Informs Risk Management
    description: The organizational mission is understood and informs cybersecurity risk management.
    category: GV.OC
    control_objective: Understand the organizational mission and use it to inform cybersecurity risk management.
    implementation_guidance: Document how the mission and business priorities shape cybersecurity risk decisions; no collector observes organizational strategy.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  - id: GV.OC-02
    title: Stakeholder Needs and Expectations
    description: Internal and external stakeholders are understood, and their needs and expectations regarding cybersecurity risk management are understood and considered.
    category: GV.OC
    control_objective: Understand internal and external stakeholders and consider their cybersecurity risk management needs and expectations.
    implementation_guidance: Maintain a stakeholder register recording each party's cybersecurity expectations and how they are considered.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  - id: GV.OC-03
    title: Legal, Regulatory, and Contractual Requirements
    description: Legal, regulatory, and contractual requirements regarding cybersecurity — including privacy and civil liberties obligations — are understood and managed.
    category: GV.OC
    control_objective: Understand and manage cybersecurity legal, regulatory, and contractual requirements, including privacy and civil liberties obligations.
    implementation_guidance: Keep a requirements register with named owners; compliance reviews and assessments show the obligations are managed.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
      - audit_reports
  - id: GV.OC-04
    title: Services Stakeholders Depend On
    description: Critical objectives, capabilities, and services that external stakeholders depend on or expect from the organization are understood and communicated.
    category: GV.OC
    control_objective: Understand and communicate the critical objectives, capabilities, and services that external stakeholders depend on or expect.
    implementation_guidance: Document critical services and the expectations placed on them, and show they have been communicated to stakeholders.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  - id: GV.OC-05
    title: Organizational Dependencies
    description: Outcomes, capabilities, and services that the organization depends on are understood and communicated.
    category: GV.OC
    control_objective: Understand and communicate the outcomes, capabilities, and services the organization depends on.
    implementation_guidance: Document upstream dependencies such as suppliers, utilities, and platforms, and communicate them to those who plan for disruption.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  # ── GV.RM  Risk Management Strategy ─────────────────────────────────────────
  - id: GV.RM-01
    title: Risk Management Objectives
    description: Risk management objectives are established and agreed to by organizational stakeholders.
    category: GV.RM
    control_objective: Establish risk management objectives and obtain agreement from organizational stakeholders.
    implementation_guidance: Record approved risk management objectives with stakeholder sign-off.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  - id: GV.RM-02
    title: Risk Appetite and Tolerance
    description: Risk appetite and risk tolerance statements are established, communicated, and maintained.
    category: GV.RM
    control_objective: Establish, communicate, and maintain risk appetite and risk tolerance statements.
    implementation_guidance: Maintain approved risk appetite and tolerance statements and show they are communicated and periodically refreshed.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  - id: GV.RM-03
    title: Enterprise Risk Management Integration
    description: Cybersecurity risk management activities and outcomes are included in enterprise risk management processes.
    category: GV.RM
    control_objective: Include cybersecurity risk management activities and outcomes in enterprise risk management processes.
    implementation_guidance: Show cybersecurity risks and outcomes feeding the enterprise risk register and its reporting.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  - id: GV.RM-04
    title: Risk Response Strategy
    description: Strategic direction that describes appropriate risk response options is established and communicated.
    category: GV.RM
    control_objective: Establish and communicate strategic direction that describes appropriate risk response options.
    implementation_guidance: Document the accepted response options (accept, mitigate, transfer, avoid) and when each applies.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  - id: GV.RM-05
    title: Risk Communication Channels
    description: Lines of communication across the organization are established for cybersecurity risks, including risks from suppliers and other third parties.
    category: GV.RM
    control_objective: Establish lines of communication across the organization for cybersecurity risks, including risks from suppliers and other third parties.
    implementation_guidance: Document escalation and reporting paths for cybersecurity risks, including third-party risks.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  - id: GV.RM-06
    title: Standardized Risk Method
    description: A standardized method for calculating, documenting, categorizing, and prioritizing cybersecurity risks is established and communicated.
    category: GV.RM
    control_objective: Establish and communicate a standardized method for calculating, documenting, categorizing, and prioritizing cybersecurity risks.
    implementation_guidance: Maintain a documented risk methodology (scales, scoring, categories) applied consistently across assessments.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  - id: GV.RM-07
    title: Strategic Opportunities
    description: Strategic opportunities (i.e., positive risks) are characterized and are included in organizational cybersecurity risk discussions.
    category: GV.RM
    control_objective: Characterize strategic opportunities (positive risks) and include them in organizational cybersecurity risk discussions.
    implementation_guidance: Record how opportunities are identified and weighed alongside threats in risk discussions.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  # ── GV.RR  Roles, Responsibilities, and Authorities ─────────────────────────
  - id: GV.RR-01
    title: Leadership Accountability and Culture
    description: Organizational leadership is responsible and accountable for cybersecurity risk and fosters a culture that is risk-aware, ethical, and continually improving.
    category: GV.RR
    control_objective: Hold organizational leadership responsible and accountable for cybersecurity risk and foster a risk-aware, ethical, and continually improving culture.
    implementation_guidance: Document leadership accountability for cybersecurity risk; training and awareness records show the culture is reinforced.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
      - training_records
  - id: GV.RR-02
    title: Roles, Responsibilities, and Authorities
    description: Roles, responsibilities, and authorities related to cybersecurity risk management are established, communicated, understood, and enforced.
    category: GV.RR
    control_objective: Establish, communicate, and enforce cybersecurity risk management roles, responsibilities, and authorities, and make sure they are understood.
    implementation_guidance: Maintain a role and authority matrix and show it is communicated and enforced.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  - id: GV.RR-03
    title: Resource Allocation
    description: Adequate resources are allocated commensurate with the cybersecurity risk strategy, roles, responsibilities, and policies.
    category: GV.RR
    control_objective: Allocate adequate resources commensurate with the cybersecurity risk strategy, roles, responsibilities, and policies.
    implementation_guidance: Document budget and staffing decisions tied to the cybersecurity risk strategy.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  - id: GV.RR-04
    title: Cybersecurity in HR Practices
    description: Cybersecurity is included in human resources practices.
    category: GV.RR
    control_objective: Include cybersecurity in human resources practices.
    implementation_guidance: Show security in hiring, onboarding, role changes, and offboarding; training records evidence it is applied.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
      - training_records
  # ── GV.PO  Policy ───────────────────────────────────────────────────────────
  - id: GV.PO-01
    title: Cybersecurity Risk Policy
    description: Policy for managing cybersecurity risks is established based on organizational context, cybersecurity strategy, and priorities and is communicated and enforced.
    category: GV.PO
    control_objective: Establish a policy for managing cybersecurity risks based on organizational context, strategy, and priorities, and communicate and enforce it.
    implementation_guidance: Maintain an approved risk management policy with evidence that it is communicated and enforced.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  - id: GV.PO-02
    title: Policy Review and Update
    description: Policy for managing cybersecurity risks is reviewed, updated, communicated, and enforced to reflect changes in requirements, threats, technology, and organizational mission.
    category: GV.PO
    control_objective: Review, update, communicate, and enforce the risk management policy to reflect changes in requirements, threats, technology, and organizational mission.
    implementation_guidance: Keep dated review history and change records for the policy.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
      - audit_reports
  # ── GV.OV  Oversight ────────────────────────────────────────────────────────
  - id: GV.OV-01
    title: Strategy Outcome Review
    description: Cybersecurity risk management strategy outcomes are reviewed to inform and adjust strategy and direction.
    category: GV.OV
    control_objective: Review risk management strategy outcomes to inform and adjust strategy and direction.
    implementation_guidance: Keep records of periodic reviews of strategy outcomes and the adjustments that followed.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - audit_reports
      - policy_document
  - id: GV.OV-02
    title: Strategy Coverage Review
    description: The cybersecurity risk management strategy is reviewed and adjusted to ensure coverage of organizational requirements and risks.
    category: GV.OV
    control_objective: Review and adjust the risk management strategy to ensure it covers organizational requirements and risks.
    implementation_guidance: Keep records showing the strategy was checked against current requirements and risks and then updated.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - audit_reports
      - policy_document
  - id: GV.OV-03
    title: Performance Evaluation
    description: Organizational cybersecurity risk management performance is evaluated and reviewed for adjustments needed.
    category: GV.OV
    control_objective: Evaluate and review organizational cybersecurity risk management performance for needed adjustments.
    implementation_guidance: Keep performance metrics, review reports, and the decisions that came out of them.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - audit_reports
  # ── GV.SC  Cybersecurity Supply Chain Risk Management ───────────────────────
  - id: GV.SC-01
    title: Supply Chain Risk Management Program
    description: A cybersecurity supply chain risk management program, strategy, objectives, policies, and processes are established and agreed to by organizational stakeholders.
    category: GV.SC
    control_objective: Establish a supply chain risk management program, strategy, objectives, policies, and processes, agreed to by organizational stakeholders.
    implementation_guidance: Maintain an approved supply chain risk management program and policy.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  - id: GV.SC-02
    title: Supplier and Partner Roles
    description: Cybersecurity roles and responsibilities for suppliers, customers, and partners are established, communicated, and coordinated internally and externally.
    category: GV.SC
    control_objective: Establish, communicate, and coordinate cybersecurity roles and responsibilities for suppliers, customers, and partners.
    implementation_guidance: Document who is responsible for what with each external party and how it is coordinated internally and externally.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  - id: GV.SC-03
    title: Supply Chain Risk Integration
    description: Cybersecurity supply chain risk management is integrated into cybersecurity and enterprise risk management, risk assessment, and improvement processes.
    category: GV.SC
    control_objective: Integrate supply chain risk management into cybersecurity and enterprise risk management, risk assessment, and improvement processes.
    implementation_guidance: Show supplier risks appearing in the enterprise risk register and in improvement plans.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  - id: GV.SC-04
    title: Supplier Criticality
    description: Suppliers are known and prioritized by criticality.
    category: GV.SC
    control_objective: Know suppliers and prioritize them by criticality.
    implementation_guidance: Maintain a supplier register with criticality ratings; no collector enumerates external suppliers.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  - id: GV.SC-05
    title: Supplier Contract Requirements
    description: Requirements to address cybersecurity risks in supply chains are established, prioritized, and integrated into contracts and other types of agreements with suppliers and other relevant third parties.
    category: GV.SC
    control_objective: Establish and prioritize supply chain cybersecurity requirements and integrate them into contracts and other agreements with suppliers and third parties.
    implementation_guidance: Keep contract clauses, security schedules, or addenda that carry the requirements.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  - id: GV.SC-06
    title: Supplier Due Diligence
    description: Planning and due diligence are performed to reduce risks before entering into formal supplier or other third-party relationships.
    category: GV.SC
    control_objective: Perform planning and due diligence to reduce risk before entering formal supplier or other third-party relationships.
    implementation_guidance: Keep pre-engagement assessment records and approvals.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
      - audit_reports
  - id: GV.SC-07
    title: Supplier Risk Monitoring
    description: The risks posed by a supplier, their products and services, and other third parties are understood, recorded, prioritized, assessed, responded to, and monitored over the course of the relationship.
    category: GV.SC
    control_objective: Understand, record, prioritize, assess, respond to, and monitor the risks posed by suppliers, their products and services, and other third parties over the course of the relationship.
    implementation_guidance: Keep supplier risk assessments, monitoring reviews, and responses across the life of each relationship.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - audit_reports
      - policy_document
  - id: GV.SC-08
    title: Suppliers in Incident Planning
    description: Relevant suppliers and other third parties are included in incident planning, response, and recovery activities.
    category: GV.SC
    control_objective: Include relevant suppliers and other third parties in incident planning, response, and recovery activities.
    implementation_guidance: Show suppliers in incident response plans and in exercise or real-incident records.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
      - incident_reports
  - id: GV.SC-09
    title: Supply Chain Security Practices
    description: Supply chain security practices are integrated into cybersecurity and enterprise risk management programs, and their performance is monitored throughout the technology product and service life cycle.
    category: GV.SC
    control_objective: Integrate supply chain security practices into cybersecurity and enterprise risk management programs and monitor their performance throughout the technology product and service life cycle.
    implementation_guidance: Keep program documentation and periodic performance reviews.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
      - audit_reports
  - id: GV.SC-10
    title: Post-Relationship Provisions
    description: Cybersecurity supply chain risk management plans include provisions for activities that occur after the conclusion of a partnership or service agreement.
    category: GV.SC
    control_objective: Include provisions in supply chain risk management plans for activities that occur after a partnership or service agreement concludes.
    implementation_guidance: Document offboarding steps (access revocation, data return or deletion, transition) and contract exit terms.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  # ── ID.AM  Asset Management ─────────────────────────────────────────────────
  - id: ID.AM-01
    title: Hardware Inventory
    description: Inventories of hardware managed by the organization are maintained.
    category: ID.AM
    control_objective: Maintain a complete, current inventory of organization-managed hardware assets.
    implementation_guidance: Combine endpoint-collected hardware data with a maintained asset register that covers devices without an agent.
    risk_level: medium
    assessment_mode: hybrid
    required_evidence:
      - system_configs
      - policy_document
  - id: ID.AM-02
    title: Software and Systems Inventory
    description: Inventories of software, services, and systems managed by the organization are maintained.
    category: ID.AM
    control_objective: Maintain a current inventory of managed software, services, and systems.
    implementation_guidance: Supplement collector-reported installed software and services with a register covering SaaS and unmonitored systems.
    risk_level: medium
    assessment_mode: hybrid
    required_evidence:
      - system_configs
      - policy_document
  - id: ID.AM-03
    title: Network and Data Flow Mapping
    description: Representations of the organization's authorized network communication and internal and external network data flows are maintained.
    category: ID.AM
    control_objective: Maintain representations of authorized network communications and internal and external data flows.
    implementation_guidance: Use collected network configuration to inform topology; maintain authorized data-flow diagrams and documentation manually.
    risk_level: medium
    assessment_mode: hybrid
    required_evidence:
      - network_configs
      - policy_document
  - id: ID.AM-04
    title: Supplier Services Inventory
    description: Inventories of services provided by suppliers are maintained.
    category: ID.AM
    control_objective: Maintain an inventory of services provided by suppliers.
    implementation_guidance: Keep a documented register of third-party and supplier services; no collector enumerates external suppliers.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  - id: ID.AM-05
    title: Asset Prioritization
    description: Assets are prioritized based on classification, criticality, resources, and impact on the mission.
    category: ID.AM
    control_objective: Prioritize assets based on classification, criticality, resources, and mission impact.
    implementation_guidance: Document classification and criticality decisions; these are business judgments not derivable from telemetry.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  - id: ID.AM-07
    title: Data Inventory
    description: Inventories of data and corresponding metadata for designated data types are maintained.
    category: ID.AM
    control_objective: Maintain inventories of data and corresponding metadata for designated data types.
    implementation_guidance: Maintain a data catalog manually; no collector produces a data inventory.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  - id: ID.AM-08
    title: Asset Lifecycle Management
    description: Systems, hardware, software, services, and data are managed throughout their life cycles.
    category: ID.AM
    control_objective: Manage systems, hardware, software, services, and data throughout their life cycles.
    implementation_guidance: Document lifecycle processes (procurement, maintenance, secure disposal); telemetry shows point-in-time state only, not lifecycle governance.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  # ── ID.RA  Risk Assessment ──────────────────────────────────────────────────
  - id: ID.RA-01
    title: Vulnerability Identification
    description: Vulnerabilities in assets are identified, validated, and recorded.
    category: ID.RA
    control_objective: Identify, validate, and record vulnerabilities in assets.
    implementation_guidance: Record vulnerability assessment results; no collector produces vulnerability-scan evidence in this vocabulary.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - audit_reports
  - id: ID.RA-02
    title: Threat Intelligence Intake
    description: Cyber threat intelligence is received from information sharing forums and sources.
    category: ID.RA
    control_objective: Receive cyber threat intelligence from information-sharing forums and sources.
    implementation_guidance: Document threat-intelligence sources and the intake process; not produced by any collector.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  - id: ID.RA-03
    title: Threat Identification
    description: Internal and external threats to the organization are identified and recorded.
    category: ID.RA
    control_objective: Identify and record internal and external threats to the organization.
    implementation_guidance: Document threat analysis; an analytical process not captured by telemetry.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  - id: ID.RA-04
    title: Impact and Likelihood Analysis
    description: Potential impacts and likelihoods of threats exploiting vulnerabilities are identified and recorded.
    category: ID.RA
    control_objective: Identify and record potential impacts and likelihoods of threats exploiting vulnerabilities.
    implementation_guidance: Document impact and likelihood assessments; human risk judgment not derivable from collected data.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  - id: ID.RA-05
    title: Inherent Risk Prioritization
    description: Threats, vulnerabilities, likelihoods, and impacts are used to understand inherent risk and inform risk response prioritization.
    category: ID.RA
    control_objective: Use threats, vulnerabilities, likelihoods, and impacts to understand inherent risk and prioritize response.
    implementation_guidance: Document inherent-risk determination and prioritization rationale; a judgment process.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  - id: ID.RA-06
    title: Risk Response Management
    description: Risk responses are chosen, prioritized, planned, tracked, and communicated.
    category: ID.RA
    control_objective: Choose, prioritize, plan, track, and communicate risk responses.
    implementation_guidance: Maintain a risk treatment register or plan; a documented process.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  - id: ID.RA-07
    title: Change and Exception Management
    description: Changes and exceptions are managed, assessed for risk impact, recorded, and tracked.
    category: ID.RA
    control_objective: Manage, assess, record, and track changes and exceptions for risk impact.
    implementation_guidance: Document change and exception approvals and their risk assessments; collectors do not capture approvals.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  - id: ID.RA-08
    title: Vulnerability Disclosure Handling
    description: Processes for receiving, analyzing, and responding to vulnerability disclosures are established.
    category: ID.RA
    control_objective: Establish processes to receive, analyze, and respond to vulnerability disclosures.
    implementation_guidance: Document the vulnerability-disclosure handling process.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  - id: ID.RA-09
    title: Supply Chain Integrity Assessment
    description: The authenticity and integrity of hardware and software are assessed prior to acquisition and use.
    category: ID.RA
    control_objective: Assess the authenticity and integrity of hardware and software prior to acquisition and use.
    implementation_guidance: Document pre-acquisition authenticity and integrity checks; a procurement process.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  - id: ID.RA-10
    title: Critical Supplier Assessment
    description: Critical suppliers are assessed prior to acquisition.
    category: ID.RA
    control_objective: Assess critical suppliers prior to acquisition.
    implementation_guidance: Retain completed supplier risk-assessment reports.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - audit_reports
  # ── ID.IM  Improvement ──────────────────────────────────────────────────────
  - id: ID.IM-01
    title: Improvement from Evaluations
    description: Improvements are identified from evaluations.
    category: ID.IM
    control_objective: Identify improvements from evaluations.
    implementation_guidance: Capture improvement items in evaluation and assessment records.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - audit_reports
  - id: ID.IM-02
    title: Improvement from Tests and Exercises
    description: Improvements are identified from security tests and exercises, including those done in coordination with suppliers and relevant third parties.
    category: ID.IM
    control_objective: Identify improvements from security tests and exercises, including those with suppliers and third parties.
    implementation_guidance: Capture improvements in test reports and lessons-learned records.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - audit_reports
  - id: ID.IM-03
    title: Improvement from Operations
    description: Improvements are identified from execution of operational processes, procedures, and activities.
    category: ID.IM
    control_objective: Identify improvements from execution of operational processes, procedures, and activities.
    implementation_guidance: Document operational process-review outcomes.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  - id: ID.IM-04
    title: Response and Recovery Plan Management
    description: Incident response plans and other cybersecurity plans that affect operations are established, communicated, maintained, and improved.
    category: ID.IM
    control_objective: Establish, communicate, maintain, and improve incident response and other cybersecurity plans that affect operations.
    implementation_guidance: Maintain incident response and related cybersecurity plans as controlled documents.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  # ── PR.AA  Identity Management, Authentication, and Access Control ───────────
  - id: PR.AA-01
    title: Identity and Credential Management
    description: Identities and credentials for authorized users, services, and hardware are managed by the organization.
    category: PR.AA
    control_objective: Manage identities and credentials for authorized users, services, and hardware.
    implementation_guidance: Collect account inventory and MFA state; maintain the credential-management policy and non-collected service and hardware identities manually.
    risk_level: high
    assessment_mode: hybrid
    required_evidence:
      - user_provisioning
      - policy_document
  - id: PR.AA-02
    title: Identity Proofing
    description: Identities are proofed and bound to credentials based on the context of interactions.
    category: PR.AA
    control_objective: Proof identities and bind them to credentials based on the context of interactions.
    implementation_guidance: Document the identity-proofing and verification process; not captured by collectors.
    risk_level: high
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  - id: PR.AA-03
    title: Authentication
    description: Users, services, and hardware are authenticated.
    category: PR.AA
    control_objective: Authenticate users, services, and hardware.
    implementation_guidance: Verified from endpoint and identity collectors (MFA enforcement and authentication settings).
    risk_level: high
    assessment_mode: automatable
    required_evidence:
      - security_policies
      - user_provisioning
  - id: PR.AA-04
    title: Identity Assertion Protection
    description: Identity assertions are protected, conveyed, and verified.
