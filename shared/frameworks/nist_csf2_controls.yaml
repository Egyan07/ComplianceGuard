  # Detect: DE.CM rows with real endpoint evidence behind them (events, firewall,
  # network, system and security-policy data, accounts) are hybrid, because the
  # collector shows part of the picture and a documented process completes it.
  # DE.AE rows are manual_upload: a detection firing is not an assessment ending,
  # so telemetry existing does not make analysis, correlation, or incident
  # declaration automatable. Nothing in Detect is marked automatable.
  # ── DE.CM  Continuous Monitoring ────────────────────────────────────────────
  - id: DE.CM-01
    title: Network Monitoring
    description: Networks and network services are monitored to find potentially adverse events.
    category: DE.CM
    control_objective: Monitor networks and network services to find potentially adverse events.
    implementation_guidance: Collected firewall, network, and event-log data show part of the picture; a documented network monitoring process (tools, coverage, alert handling) completes it.
    risk_level: medium
    assessment_mode: hybrid
    required_evidence:
      - firewall_configs
      - network_configs
      - event_logs
      - policy_document
  - id: DE.CM-02
    title: Physical Environment Monitoring
    description: The physical environment is monitored to find potentially adverse events.
    category: DE.CM
    control_objective: Monitor the physical environment to find potentially adverse events.
    implementation_guidance: Document physical monitoring (access control, cameras, alarms) and keep review records; no endpoint collector observes the physical environment.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
      - audit_reports
  - id: DE.CM-03
    title: Personnel Activity and Technology Usage Monitoring
    description: Personnel activity and technology usage are monitored to find potentially adverse events.
    category: DE.CM
    control_objective: Monitor personnel activity and technology usage to find potentially adverse events.
    implementation_guidance: Collected event logs and account data show technology usage on endpoints; a documented monitoring policy covers what is monitored and how personnel are informed.
    risk_level: medium
    assessment_mode: hybrid
    required_evidence:
      - event_logs
      - user_provisioning
      - policy_document
  - id: DE.CM-06
    title: External Service Provider Monitoring
