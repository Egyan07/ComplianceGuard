  # Respond: every row is manual_upload except RS.AN-07. Incident response is
  # people and process, so records (plans, triage notes, investigation reports,
  # notices) are the evidence and no endpoint collector can show that a response
  # step was carried out. RS.AN-07 is hybrid because collected event logs are real
  # raw incident data, while preserving integrity and provenance still needs a
  # documented procedure. Nothing in Respond is marked automatable.
  # ── RS.MA  Incident Management ──────────────────────────────────────────────
  - id: RS.MA-01
    title: Incident Response Plan Execution
    description: The incident response plan is executed in coordination with relevant third parties once an incident is declared.
    category: RS.MA
    control_objective: Execute the incident response plan, in coordination with relevant third parties, once an incident is declared.
    implementation_guidance: Keep the incident response plan and records showing it was followed for real incidents or exercises, including coordination with third parties; no endpoint collector observes plan execution.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
      - incident_reports
  - id: RS.MA-02
    title: Incident Triage and Validation
    description: Incident reports are triaged and validated.
    category: RS.MA
    control_objective: Triage and validate incident reports.
    implementation_guidance: Keep triage records (intake, validation outcome, who decided); a detection firing is an input to triage, not evidence that triage happened.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - incident_reports
      - policy_document
  - id: RS.MA-03
    title: Incident Categorization and Prioritization
