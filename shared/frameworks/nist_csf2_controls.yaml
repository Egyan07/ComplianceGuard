  - id: RS.AN-03
    title: Incident Analysis and Root Cause
    description: Analysis is performed to establish what has taken place during an incident and the root cause of the incident.
    category: RS.AN
    control_objective: Perform analysis to establish what has taken place during an incident and the root cause of the incident.
