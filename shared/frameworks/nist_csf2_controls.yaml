    assessment_mode: hybrid
    required_evidence:
      - security_policies
      - encryption_policies
  - id: PR.DS-10
    title: Data-in-Use Protection
    description: The confidentiality, integrity, and availability of data-in-use are protected.
    category: PR.DS
    control_objective: Protect the confidentiality, integrity, and availability of data in use.
    implementation_guidance: Document runtime and in-use data protection; not captured by collectors.
    risk_level: high
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  - id: PR.DS-11
    title: Data Backup
    description: Backups of data are created, protected, maintained, and tested.
