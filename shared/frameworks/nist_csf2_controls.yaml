    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
      - incident_reports
  - id: RC.RP-02
    title: Recovery Action Selection and Performance
    description: Recovery actions are selected, scoped, prioritized, and performed.
    category: RC.RP
    control_objective: Select, scope, prioritize, and perform recovery actions.
    implementation_guidance: Keep recovery records showing which actions were chosen, how they were scoped and prioritized, and that they were carried out.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - incident_reports
      - policy_document
  - id: RC.RP-03
    title: Backup and Restoration Asset Integrity
