    category: DE.CM
    control_objective: Monitor external service provider activities and services to find potentially adverse events.
    implementation_guidance: Keep provider monitoring records (service reviews, provider log or alert reviews); endpoint collectors do not observe third-party services.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
      - audit_reports
  - id: DE.CM-09
    title: Computing Hardware, Software, and Runtime Monitoring
    description: Computing hardware and software, runtime environments, and their data are monitored to find potentially adverse events.
