    category: RS.MA
    control_objective: Escalate or elevate incidents as needed.
    implementation_guidance: Document escalation criteria and paths and keep records of incidents that were escalated.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
      - incident_reports
  - id: RS.MA-05
    title: Incident Recovery Initiation Criteria
    description: The criteria for initiating incident recovery are applied.
    category: RS.MA
    control_objective: Apply the criteria for initiating incident recovery.
    implementation_guidance: Document the criteria for starting recovery and keep records showing they were applied to an incident.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
      - incident_reports
