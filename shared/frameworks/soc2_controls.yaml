# SOC 2 — 2017 Trust Services Criteria (with revised points of focus, 2022)
#
# THE canonical SOC 2 definition. Both scoring engines (backend
# canonical_evidence.py and electron/processing/canonical-engine.js), the
# desktop framework browser, and the generated frontend evidence catalog all
# read THIS file. Do not maintain a second copy.
#
# Structure (per AICPA TSP Section 100):
#   - Security (Common Criteria CC1-CC9): 33 criteria, applicable to every
#     SOC 2 engagement.
#   - Availability (A1.1-A1.3), Confidentiality (C1.1-C1.2) and Processing
#     Integrity (PI1.1-PI1.5): category-specific supplemental criteria,
#     included when the corresponding category is in the audit scope.
#   - Privacy (P-series) is intentionally NOT included: it is a separate
#     category with its own criteria and is out of scope for this product.
#   - There is NO "Confidentiality & Availability (CA)" category in the TSC;
#     such a category in any older data was fabricated.
#
# Descriptions are the verbatim criterion statements from the 2017 TSC
# (with 2022 revised points of focus). Titles are short descriptive labels.
#
# assessment_mode (product classification, not part of the AICPA criteria):
#   automatable   - required evidence can be produced by the endpoint
#                   collectors; the coverage engine may fully score it.
#   hybrid        - endpoint evidence contributes partial coverage; full
#                   coverage requires uploaded manual evidence.
#   manual_upload - only uploaded manual evidence can satisfy the criterion;
#                   endpoint telemetry alone must never mark it compliant.
#
framework:
  id: soc2_v2017
  name: SOC 2 Type II
  version: '2017'
  taxonomy: '2017 Trust Services Criteria (with 2022 revised points of focus)'
  scope_note: >-
    Security (CC) criteria are always applicable; Availability, Confidentiality,
    and Processing Integrity supplemental criteria are included here for
    category-scoped engagements. Privacy (P-series) is out of scope.
  status_vocabulary:
    - compliant
    - partial
    - non_compliant
    - not_assessed
  legacy_evidence_types:
    - event_logs
    - file_permissions
    - firewall
    - iam_mfa
    - iam_policy
    - network
    - security_settings
    - services
    - software
    - system_info
    - update_status
    - users
controls:
  # ── CC1 Control Environment ────────────────────────────────────────────────
  - id: CC1.1
    title: Integrity and Ethical Values
    description: The entity demonstrates a commitment to integrity and ethical values.
    category: CC
    control_objective: Demonstrate a commitment to integrity and ethical values across the organization.
    implementation_guidance: Maintain a code of conduct, communicate it to all personnel, and enforce it consistently.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
      - training_records
  - id: CC1.2
    title: Board Oversight and Independence
    description: The board of directors demonstrates independence from management and exercises oversight of the development and performance of internal control.
    category: CC
    control_objective: Ensure board independence and oversight of internal control.
    implementation_guidance: Document board structure and independence criteria; retain minutes evidencing oversight of the control environment.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
      - audit_reports
  - id: CC1.3
    title: Organizational Structure and Reporting Lines
    description: Management establishes, with board oversight, structures, reporting lines, and appropriate authorities and responsibilities in the pursuit of objectives.
    category: CC
    control_objective: Establish structures, reporting lines, and authorities in pursuit of objectives.
    implementation_guidance: Maintain an org chart and role/responsibility definitions with assigned security responsibilities.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  - id: CC1.4
    title: Commitment to Competence
    description: The organization demonstrates a commitment to attract, develop, and retain competent individuals in alignment with objectives.
    category: CC
    control_objective: Attract, develop, and retain competent individuals aligned with objectives.
    implementation_guidance: Define competency requirements, run onboarding/training, and retain completion records.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
      - training_records
  - id: CC1.5
    title: Individual Accountability
    description: The organization holds individuals accountable for their internal control responsibilities in the pursuit of objectives.
    category: CC
    control_objective: Hold individuals accountable for internal control responsibilities.
    implementation_guidance: Embed control responsibilities in role descriptions and enforce accountability through reviews and discipline processes.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  # ── CC2 Communication and Information ─────────────────────────────────────
  - id: CC2.1
    title: Quality of Information
    description: The entity obtains or generates and uses relevant, quality information to support the functioning of internal control.
    category: CC
    control_objective: Obtain and use relevant, quality information to support internal control.
    implementation_guidance: Identify the information internal control needs, define its quality requirements, and maintain the systems that produce it.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  - id: CC2.2
    title: Internal Communication
    description: The entity internally communicates information, including objectives and responsibilities for internal control, necessary to support the functioning of internal control.
    category: CC
    control_objective: Communicate internal control objectives and responsibilities internally.
    implementation_guidance: Communicate policies and responsibilities to personnel and record the communication channels used.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
      - training_records
  - id: CC2.3
    title: External Communication
    description: The entity communicates with external parties regarding matters affecting the functioning of internal control.
    category: CC
    control_objective: Communicate with external parties on matters affecting internal control.
    implementation_guidance: Establish communication channels for customers, vendors, and regulators affecting the control environment.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  # ── CC3 Risk Assessment ───────────────────────────────────────────────────
  - id: CC3.1
    title: Objectives Specification
    description: The entity specifies objectives with sufficient clarity to enable the identification and assessment of risks relating to objectives.
    category: CC
    control_objective: Specify objectives clearly enough to identify and assess related risks.
    implementation_guidance: Document business and reporting objectives with sufficient clarity for risk identification.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
      - audit_reports
  - id: CC3.2
    title: Risk Identification and Analysis
    description: The entity identifies risks to the achievement of its objectives across the entity and analyzes risks as a basis for determining how the risks should be managed.
    category: CC
    control_objective: Identify and analyze risks across the entity to determine how they should be managed.
    implementation_guidance: Run periodic risk assessments covering the entity and its systems; retain results and treatment decisions.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - audit_reports
      - policy_document
  - id: CC3.3
    title: Fraud Consideration
    description: The entity considers the potential for fraud in assessing risks to the achievement of objectives.
    category: CC
    control_objective: Consider fraud potential when assessing risks.
    implementation_guidance: Include fraud scenarios in the risk assessment process and document the analysis.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - audit_reports
      - policy_document
  - id: CC3.4
    title: Change Risk Assessment
    description: The entity identifies and assesses changes that could significantly affect the system of internal control.
    category: CC
    control_objective: Identify and assess changes that could significantly affect internal control.
    implementation_guidance: Monitor internal and external change drivers and reassess risk when significant change occurs.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - audit_reports
      - policy_document
  # ── CC4 Monitoring Activities ─────────────────────────────────────────────
  - id: CC4.1
    title: Ongoing and Separate Evaluations
    description: The entity selects, develops, and performs ongoing and/or separate evaluations to ascertain whether the components of internal control are present and functioning.
    category: CC
    control_objective: Perform ongoing and/or separate evaluations of internal control components.
    implementation_guidance: Combine continuous endpoint monitoring with periodic separate evaluations such as internal audits.
    risk_level: medium
    assessment_mode: hybrid
    required_evidence:
      - event_logs
      - audit_reports
  - id: CC4.2
    title: Evaluation and Communication of Deficiencies
    description: The entity evaluates and communicates internal control deficiencies in a timely manner to those parties responsible for taking corrective action, including senior management and the board of directors, as appropriate.
    category: CC
    control_objective: Evaluate and communicate internal control deficiencies to responsible parties in a timely manner.
    implementation_guidance: Track identified deficiencies, assign owners, and report them to management and the board as appropriate.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - audit_reports
      - incident_reports
  # ── CC5 Control Activities ────────────────────────────────────────────────
  - id: CC5.1
    title: Selection of Control Activities
    description: The entity selects and develops control activities that contribute to the mitigation of risks to the achievement of objectives to acceptable levels.
    category: CC
    control_objective: Select and develop control activities that mitigate risks to acceptable levels.
    implementation_guidance: Map control activities to assessed risks and document the selection rationale.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
      - audit_reports
  - id: CC5.2
    title: General Controls over Technology
    description: The entity selects and develops general control activities over technology to support the achievement of objectives.
    category: CC
    control_objective: Select and develop general control activities over technology.
    implementation_guidance: Define general technology controls (access management, operations, change) and evidence their operation.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
      - audit_reports
  - id: CC5.3
    title: Deployment Through Policies and Procedures
    description: The entity deploys control activities through policies that establish what is expected and procedures that put policies into action.
    category: CC
    control_objective: Deploy control activities through policies and implementing procedures.
    implementation_guidance: Pair each security policy with operating procedures and train personnel on both.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  # ── CC6 Logical and Physical Access Security ──────────────────────────────
  - id: CC6.1
    title: Logical Access Security
    description: The entity implements logical access security software, infrastructure, and architectures over protected information assets to protect them from security events to meet the entity's objectives.
    category: CC
    control_objective: Implement logical access security software, infrastructure, and architectures over protected assets.
    implementation_guidance: Enforce authentication and endpoint protection (e.g., password policy, AV/EDR) and document the access architecture.
    risk_level: high
    assessment_mode: hybrid
    required_evidence:
      - system_configs
      - security_policies
      - policy_document
  - id: CC6.2
    title: User Registration and Credential Management
    description: Prior to issuing system credentials and granting system access, the entity registers and authorizes new internal and external users whose access is administered by the entity. For those users whose access is administered by the entity, user system credentials are removed when user access is no longer authorized.
    category: CC
    control_objective: Register and authorize users before issuing credentials; remove credentials when access is no longer authorized.
    implementation_guidance: Maintain a provisioning/deprovisioning workflow; review local accounts and administrative group membership regularly.
    risk_level: high
    assessment_mode: hybrid
    required_evidence:
      - user_provisioning
      - policy_document
  - id: CC6.3
    title: Access Authorization and Modification
    description: The entity authorizes, modifies, or removes access to data, software, functions, and other protected information assets based on roles, responsibilities, or the system design and changes, giving consideration to the concepts of least privilege and segregation of duties, to meet the entity's objectives.
    category: CC
    control_objective: Authorize, modify, or remove access based on roles, with least privilege and segregation of duties.
    implementation_guidance: Review role assignments and privilege levels; evidence least-privilege configuration on endpoints.
    risk_level: high
    assessment_mode: hybrid
    required_evidence:
      - user_provisioning
      - policy_document
  - id: CC6.4
    title: Physical Access Restrictions
    description: The entity restricts physical access to facilities and protected information assets (for example, data center facilities, back-up media storage, and other sensitive locations) to authorized personnel to meet the entity's objectives.
    category: CC
    control_objective: Restrict physical access to facilities and protected information assets to authorized personnel.
    implementation_guidance: Maintain physical access policies and badge/key controls; endpoint collectors cannot observe facilities, so upload physical-security evidence.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  - id: CC6.5
    title: Disposal of Physical Assets
    description: The entity discontinues logical and physical protections over physical assets only after the ability to read or recover data and software from those assets has been diminished and is no longer required to meet the entity's objectives.
    category: CC
    control_objective: Discontinue protections over physical assets only after data recovery ability has been diminished and is no longer required.
    implementation_guidance: Follow a media sanitization/disposal policy and retain disposal certificates.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  - id: CC6.6
    title: Protection Against External Threats
    description: The entity implements logical access security measures to protect against threats from sources outside its system boundaries.
    category: CC
    control_objective: Implement logical access security measures against threats from outside the system boundary.
    implementation_guidance: Enable and configure host firewall profiles, restrict exposed network services, and review boundary rules.
    risk_level: high
    assessment_mode: automatable
    required_evidence:
      - firewall_configs
      - network_configs
      - system_configs
  - id: CC6.7
    title: Restriction of Information Transmission
    description: The entity restricts the transmission, movement, and removal of information to authorized internal and external users and processes, and protects it during transmission, movement, or removal to meet the entity's objectives.
    category: CC
    control_objective: Restrict transmission, movement, and removal of information to authorized parties and protect it in transit.
    implementation_guidance: Enforce encryption in transit and review network services and open ports that move data off the endpoint.
    risk_level: medium
    assessment_mode: hybrid
    required_evidence:
      - network_configs
      - encryption_policies
  - id: CC6.8
    title: Unauthorized and Malicious Software Controls
    description: The entity implements controls to prevent or detect and act upon the introduction of unauthorized or malicious software to meet the entity's objectives.
    category: CC
    control_objective: Prevent, or detect and act upon, unauthorized or malicious software introduction.
    implementation_guidance: Run anti-malware protection with real-time detection enabled and definition updates configured.
    risk_level: high
    assessment_mode: automatable
    required_evidence:
      - system_configs
      - event_logs
  # ── CC7 System Operations ─────────────────────────────────────────────────
  - id: CC7.1
    title: Configuration and Vulnerability Detection
    description: To meet its objectives, the entity uses detection and monitoring procedures to identify (1) changes to configurations that result in the introduction of new vulnerabilities, and (2) susceptibilities to newly discovered vulnerabilities.
    category: CC
    control_objective: Detect configuration changes that introduce vulnerabilities and susceptibility to newly discovered vulnerabilities.
    implementation_guidance: Keep update services enabled and audit configurations; collect event logs as the baseline for change detection.
    risk_level: medium
    assessment_mode: automatable
    required_evidence:
      - event_logs
      - system_configs
  - id: CC7.2
    title: Anomaly Monitoring
    description: The entity monitors system components and the operation of those components for anomalies that are indicative of malicious acts, natural disasters, and errors affecting the entity's ability to meet its objectives; anomalies are analyzed to determine whether they represent security events.
    category: CC
    control_objective: Monitor system components for anomalies and analyze them for security events.
    implementation_guidance: Enable audit policy and retain security event logs; upload analysis outputs from your monitoring tooling.
    risk_level: high
    assessment_mode: hybrid
    required_evidence:
      - event_logs
      - audit_reports
  - id: CC7.3
    title: Security Event Evaluation
    description: The entity evaluates security events to determine whether they could or have resulted in a failure of the entity to meet its objectives (security incidents) and, if so, takes actions to prevent or address such failures.
    category: CC
    control_objective: Evaluate security events to determine whether they constitute security incidents and act accordingly.
    implementation_guidance: Define evaluation criteria for security events and record triage outcomes; endpoint telemetry alone cannot prove this.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - incident_reports
      - audit_reports
  - id: CC7.4
    title: Incident Response
    description: The entity responds to identified security incidents by executing a defined incident-response program to understand, contain, remediate, and communicate security incidents, as appropriate.
    category: CC
    control_objective: Respond to security incidents by executing a defined incident-response program.
    implementation_guidance: Maintain an incident-response plan and retain incident records showing containment, remediation, and communication.
    risk_level: high
    assessment_mode: manual_upload
    required_evidence:
      - incident_reports
      - policy_document
  - id: CC7.5
    title: Recovery from Security Incidents
    description: The entity identifies, develops, and implements activities to recover from identified security incidents.
    category: CC
    control_objective: Identify, develop, and implement recovery activities following security incidents.
    implementation_guidance: Maintain restore/backup evidence and post-incident recovery records.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - backup_logs
      - incident_reports
  # ── CC8 Change Management ─────────────────────────────────────────────────
  - id: CC8.1
    title: Change Management
    description: The entity authorizes, designs, develops or acquires, configures, documents, tests, approves, and implements changes to infrastructure, data, software, and procedures to meet its objectives.
    category: CC
    control_objective: Authorize, test, approve, and implement changes to infrastructure, data, software, and procedures.
    implementation_guidance: Maintain a change-management policy with authorization and testing records; software inventory supports the asset baseline.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
      - audit_reports
  # ── CC9 Risk Mitigation ───────────────────────────────────────────────────
  - id: CC9.1
    title: Business Disruption Risk Mitigation
    description: The entity identifies, selects, and develops risk mitigation activities for risks arising from potential business disruptions.
    category: CC
    control_objective: Identify and develop risk mitigation activities for potential business disruptions.
    implementation_guidance: Maintain continuity plans and backup/restore evidence for disruption scenarios.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - backup_logs
      - policy_document
  - id: CC9.2
    title: Vendor and Business Partner Risk
    description: The entity assesses and manages risks associated with (vulnerabilities arising from) vendors and business partners.
    category: CC
    control_objective: Assess and manage risks associated with vendors and business partners.
    implementation_guidance: Maintain vendor risk assessments and contracts with security commitments.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
      - audit_reports
  # ── A1 Availability (supplemental) ────────────────────────────────────────
  - id: A1.1
    title: Processing Capacity Management
    description: The entity maintains, monitors, and evaluates current processing capacity and use of system components (infrastructure, data, and software) to manage capacity demand and to enable the implementation of additional capacity to help meet its objectives.
    category: A
    control_objective: Maintain, monitor, and evaluate processing capacity and component use to meet demand.
    implementation_guidance: Track system configuration and resource data; upload capacity monitoring reports for full coverage.
    risk_level: medium
    assessment_mode: hybrid
    required_evidence:
      - system_configs
      - audit_reports
  - id: A1.2
    title: Environmental Protections, Backup, and Recovery Infrastructure
    description: The entity authorizes, designs, develops or acquires, implements, operates, approves, maintains, and monitors environmental protections, software, data back-up processes, and recovery infrastructure to meet its objectives.
    category: A
    control_objective: Implement and monitor environmental protections, backup processes, and recovery infrastructure.
    implementation_guidance: Retain backup success/failure logs and evidence of monitored recovery infrastructure.
    risk_level: medium
    assessment_mode: hybrid
    required_evidence:
      - backup_logs
      - system_configs
  - id: A1.3
    title: Recovery Plan Testing
    description: The entity tests recovery plan procedures supporting system recovery to meet its objectives.
    category: A
    control_objective: Test recovery plan procedures supporting system recovery.
    implementation_guidance: Schedule and document recovery tests; retain test results and gaps found.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - backup_logs
      - audit_reports
  # ── C1 Confidentiality (supplemental) ─────────────────────────────────────
  - id: C1.1
    title: Identification and Maintenance of Confidential Information
    description: The entity identifies and maintains confidential information to meet the entity's objectives related to confidentiality.
    category: C
    control_objective: Identify and maintain confidential information in line with confidentiality objectives.
    implementation_guidance: Maintain a data classification scheme and handling policies; upload classification documentation.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
  - id: C1.2
    title: Disposal of Confidential Information
    description: The entity disposes of confidential information to meet the entity's objectives related to confidentiality.
    category: C
    control_objective: Dispose of confidential information securely.
    implementation_guidance: Follow a retention/disposal policy and retain disposal records.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
      - audit_reports
  # ── PI1 Processing Integrity (supplemental) ───────────────────────────────
  - id: PI1.1
    title: Processing Information Quality
    description: The entity obtains or generates, uses, and communicates relevant, quality information regarding the objectives related to processing, including definitions of data processed and product and service specifications, to support the use of products and services.
    category: PI
    control_objective: Obtain, use, and communicate quality information about processing objectives and specifications.
    implementation_guidance: Document data definitions and processing specifications; upload supporting documentation.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
      - audit_reports
  - id: PI1.2
    title: Input Completeness and Accuracy
    description: The entity implements policies and procedures over system inputs, including controls over completeness and accuracy, to result in products, services, and reporting to meet the entity's objectives.
    category: PI
    control_objective: Implement policies and procedures controlling the completeness and accuracy of system inputs.
    implementation_guidance: Document input controls and validation procedures; upload evidence of their operation.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
      - audit_reports
  - id: PI1.3
    title: System Processing Controls
    description: The entity implements policies and procedures over system processing to result in products, services, and reporting to meet the entity's objectives.
    category: PI
    control_objective: Implement policies and procedures over system processing.
    implementation_guidance: Document processing controls; endpoint event logs evidence processing activity but not control design.
    risk_level: medium
    assessment_mode: hybrid
    required_evidence:
      - event_logs
      - policy_document
  - id: PI1.4
    title: Output Delivery
    description: The entity implements policies and procedures to make available or deliver output completely, accurately, and timely in accordance with specifications to meet the entity's objectives.
    category: PI
    control_objective: Deliver output completely, accurately, and timely in accordance with specifications.
    implementation_guidance: Document output validation and delivery procedures; upload evidence of their operation.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
      - audit_reports
  - id: PI1.5
    title: Storage of Inputs and Outputs
    description: The entity implements policies and procedures to store inputs, items in processing, and outputs completely, accurately, and timely in accordance with system specifications to meet the entity's objectives.
    category: PI
    control_objective: Store inputs, in-process items, and outputs completely, accurately, and timely per specifications.
    implementation_guidance: Document storage procedures and retention controls; upload evidence of their operation.
    risk_level: medium
    assessment_mode: manual_upload
    required_evidence:
      - policy_document
      - audit_reports
