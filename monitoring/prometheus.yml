# Minimal Prometheus scrape + alerting stack for ComplianceGuard.
#
# Deployment: run this container on the internal Docker network (it can reach
# the backend directly, bypassing nginx — /metrics is loopback-allowed for the
# in-network scraper, H-3) and point Alertmanager at ALERTMANAGER_URL below.
#
#   docker run -d --name prometheus \
#     --network complianceguard_internal \
#     -v ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro \
#     -v ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro \
#     prom/prometheus:latest
#
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

# Paste a real alertmanager URL here to receive notifications
# (email/Slack/PagerDuty). Without it, alerts fire and stay in Prometheus only.
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: complianceguard-backend
    metrics_path: /metrics
    # Resolve to the backend container on the shared Docker network.
    # In host-network setups use 127.0.0.1:8000 (loopback is always allowed).
    static_configs:
      - targets: ["backend:8000"]
